<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.A.T.S. | Bizarre Atmosphere Testing System</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-black: #1a1a1a;
            --text-white: #f5f5f5;
            --accent-color: #ff3e3e; /* A morbid touch of red */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* The Black Card Styling */
        .card {
            background-color: var(--card-black);
            width: 300px;
            height: 420px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-text {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .card-footer {
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo-icon {
            width: 20px;
            height: 20px;
            background-color: var(--text-white);
            border-radius: 50%;
            margin-right: 8px;
        }

        /* Instructions */
        .hint {
            margin-top: 30px;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button {
            margin-top: 20px;
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            border-color: var(--accent-color);
            color: var(--text-white);
        }
    </style>
</head>
<body>

    <div class="card" onclick="drawBlackCard()">
        <div id="black-card-text" class="card-text">Click to initialize the Atmosphere...</div>
        <div class="card-footer">
            <div class="logo-icon"></div>
            B.A.T.S.
        </div>
    </div>

    <div class="hint">Tap card to draw a new prompt</div>
    <button onclick="drawBlackCard()">Refresh Prompt</button>

    <script>
        // UPDATE THESE TWO LINES
        const GITHUB_USER = "theygrewv"; 
        const GITHUB_REPO = "bats-engine";
        const BASE_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/data`;

        async function drawBlackCard() {
            const textElement = document.getElementById('black-card-text');
            textElement.style.opacity = "0.5";
            
            try {
                // 1. Fetch manifest
                const manifestResponse = await fetch(`${BASE_URL}/manifest.json`);
                const manifest = await manifestResponse.json();
                
                // 2. Random logic
                const total = manifest.stats.blackCardsCount;
                const randomId = Math.floor(Math.random() * total) + 1;
                const formattedId = String(randomId).padStart(3, '0');
                
                // 3. Fetch card
                const cardResponse = await fetch(`${BASE_URL}/cards/black/prompt-${formattedId}.json`);
                const card = await cardResponse.json();
                
                // 4. Update UI
                textElement.innerText = card.text;
            } catch (error) {
                textElement.innerText = "Error: Check your GITHUB_USER and REPO_NAME in the script.";
                console.error(error);
            } finally {
                textElement.style.opacity = "1";
            }
        }

        // Initial draw on load
        drawBlackCard();
    </script>
</body>
</html>
