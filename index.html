<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.A.T.S. | Play Area</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-black: #1a1a1a;
            --card-white: #ffffff;
            --text-dark: #1a1a1a;
            --text-light: #f5f5f5;
            --accent: #ff3e3e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            align-items: center;
        }

        /* The Black Card (Prompt) Section */
        #table {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .black-card {
            background-color: var(--card-black);
            width: 260px;
            height: 360px;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }

        /* The White Card (Hand) Section */
        #hand-container {
            width: 100%;
            background: #151515;
            padding: 20px 0;
            border-top: 1px solid #333;
            overflow-x: auto;
            white-space: nowrap;
        }

        .hand-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 10px;
            padding-left: 20px;
        }

        .white-card {
            display: inline-flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: var(--card-white);
            color: var(--text-dark);
            width: 160px;
            height: 220px;
            border-radius: 8px;
            padding: 15px;
            margin: 0 10px;
            white-space: normal;
            vertical-align: top;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .white-card:hover {
            transform: translateY(-15px) rotate(2deg);
        }

        .card-text { font-weight: 700; font-size: 18px; }
        .white-card .card-text { font-size: 14px; }
        
        .footer { font-size: 10px; font-weight: 900; opacity: 0.5; }

        /* Hide Scrollbar */
        #hand-container::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="table">
        <div class="black-card" onclick="refreshGame()">
            <div id="prompt-text" class="card-text">Loading prompt...</div>
            <div class="footer">B.A.T.S. PROMPT</div>
        </div>
        <div style="font-size: 12px; color: #444;">Click prompt to refresh whole board</div>
    </div>

    <div class="hand-label">Your Unhinged Responses</div>
    <div id="hand-container">
        </div>

    <script>
        const GITHUB_USER = "YOUR_USERNAME"; 
        const GITHUB_REPO = "YOUR_REPO_NAME";
        const BASE_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/data`;

        async function refreshGame() {
            try {
                const manifest = await (await fetch(`${BASE_URL}/manifest.json`)).json();
                
                // 1. Load Black Card
                const bTotal = manifest.stats.blackCardsCount;
                const bId = String(Math.floor(Math.random() * bTotal) + 1).padStart(3, '0');
                const bCard = await (await fetch(`${BASE_URL}/cards/black/prompt-${bId}.json`)).json();
                document.getElementById('prompt-text').innerText = bCard.text;

                // 2. Load 5 Random White Cards
                const handContainer = document.getElementById('hand-container');
                handContainer.innerHTML = ''; // Clear hand
                
                const wTotal = manifest.stats.whiteCardsCount;
                let usedIds = new Set();

                while(usedIds.size < 5) {
                    let rId = Math.floor(Math.random() * wTotal) + 1;
                    if(!usedIds.has(rId)) {
                        usedIds.add(rId);
                        const wId = String(rId).padStart(3, '0');
                        const wCard = await (await fetch(`${BASE_URL}/cards/white/response-${wId}.json`)).json();
                        
                        const cardDiv = document.createElement('div');
                        cardDiv.className = 'white-card';
                        cardDiv.innerHTML = `
                            <div class="card-text">${wCard.text}</div>
                            <div class="footer">B.A.T.S. RESPONSE</div>
                        `;
                        cardDiv.onclick = () => alert(`You played: ${wCard.text}`);
                        handContainer.appendChild(cardDiv);
                    }
                }
            } catch (e) {
                console.error("Atmosphere Error:", e);
            }
        }

        refreshGame();
    </script>
</body>
</html>
